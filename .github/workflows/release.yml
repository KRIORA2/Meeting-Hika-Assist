name: Build and Release Desktop App

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10
  workflow_dispatch: # Allow manual trigger for testing

jobs:
  release:
    name: Build & Release Windows App
    runs-on: windows-latest
    
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web App (Frontend)
        run: pnpm --filter @workspace/hika run build
        
      - name: Build Desktop App & Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # -------------------------------------------------------------
          # CODE SIGNING SETUP (Required for a professional installation)
          # -------------------------------------------------------------
          # To stop the blue "Windows Protected your PC" SmartScreen warning,
          # you must purchase a Code Signing Certificate (e.g. from SSL.com).
          # Once you have it, export it as base64, and add it to your 
          # GitHub Repository Secrets as CSC_LINK, and the password as 
          # CSC_KEY_PASSWORD. Uncomment the lines below once added.
          # -------------------------------------------------------------
          # CSC_LINK: ${{ secrets.CSC_LINK }}
          # CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: pnpm --filter @workspace/hika-desktop run dist

      - name: Upload Installer to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: artifacts/hika-desktop/release/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
