name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck workspace
        run: pnpm typecheck

      - name: Verify answer quality
        env:
          HIKA_SKIP_MEMORY_PERSIST: "1"
        run: pnpm verify:answers

      - name: Verify Realtime security
        run: pnpm verify:realtime

      - name: Build API
        run: pnpm --filter @workspace/api-server run build

      - name: Build web application
        run: pnpm --filter @workspace/hika run build

      - name: Compile desktop application
        run: pnpm --filter @workspace/hika-desktop run compile
